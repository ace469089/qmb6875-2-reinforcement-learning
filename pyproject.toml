[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rlearn"
version = "1.0.0"
description = "Reinforcement learning from zero: bandits, Q-learning, SARSA and the gold trader (QMB 6875)"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.11", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
